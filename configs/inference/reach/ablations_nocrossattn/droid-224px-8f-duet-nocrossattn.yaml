device: cuda:0

# PyTorch Inductor; BF16 matches training precision.
optimization:
  mode: reduce-overhead
  dynamic: false
  precision: bfloat16

# data
data:
  fps: 4
  crop_size: 224
  patch_size: 16
  tubelet_size: 2
  camera_views:
  - right_mp4_path
  - wrist_mp4_path

# data aug
data_aug:
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 1.777
  - 1.777
  reprob: 0.0

# model + checkpoints  
meta:
  pretrain_checkpoint: /workspace/duet-dino/checkpoints/vitg.pt
  pretrain_dinocheckpoint: /workspace/duet-dino/checkpoints/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth
  context_encoder_key: target_encoder
  use_sdpa: true

model:
  model_name: vit_giant_xformers
  use_dinov3_encoder: true
  dual_view_training: true
  cross_attention: false
  predictor_checkpoint: /workspace/duet-dino/checkpoints/duet_dino_nocrossattn.pt
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16
  cross_attn_num_heads: 16
  uniform_power: true
  use_activation_checkpointing: false
  use_extrinsics: false
  use_rope: true

# mpc_args
mpc_args:
  history: 0
  rollout_horizon: 1
  samples: 800
  topk: 50
  elite_temperature: 0.25
  cem_steps: 2
  momentum_mean: 0.25
  momentum_mean_rot: 0.25
  momentum_mean_gripper: 0.15
  momentum_std: 0.75
  momentum_std_rot: 0.75
  momentum_std_gripper: 0.75
  maxnorm: 0.075 # max xyz delta per step, also initial xyz std
  maxrotnorm: 0.20 # max euler delta per step, also initial rot std
  maxgrippernorm: 0.5 # max gripper delta per step, also initial gripper std

exp:
  warm-starting: false

log:
  modelname: duet_dino_nocrossattn
  log_predictions: false
  log_inference_times: false
  output_dir: output